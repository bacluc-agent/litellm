litellm:
  db:
    deployStandalone: false
    useExisting: true
    secret:
      endpointKey: "endpoint"
  image:
    repository: ghcr.io/berriai/litellm
    pullPolicy: Always
  serviceAccount:
    create: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  proxy_config:
    litellm_settings:
      require_auth_for_metrics_endpoint: false
      success_callback: ["otel"]
      callbacks:
        - prometheus
    environment_variables:
      OTEL_EXPORTER: "console"
      LITELLM_DISABLE_NO_REDIS_WARNING: true
  masterkeySecretName: "runtime-secrets"
  ingress:
    enabled: true
    className: "openshift-default"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      haproxy.router.openshift.io/timeout: "20m"
    hosts:
      - host: litellm-proxy.apps.cloudscale-lpg-2.appuio.cloud
        paths:
          - path: /
            pathType: ImplementationSpecific
          - path: /metrics
            pathType: ImplementationSpecific
            backend:
              service:
                name: nonexistent-service
                port:
                  number: 9999
    tls:
      - hosts:
        - litellm-proxy.apps.cloudscale-lpg-2.appuio.cloud
        secretName: litellm-ingress
  environmentConfigMaps:
    - runtime-env
  environmentSecrets:
    - runtime-secrets

  replicaCount: 2
  serviceMonitor:
    enabled: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 2
      memory: 3Gi
    requests:
      cpu: 10m
      memory: 1000Mi
  migrationJob:
    hooks:
      helm:
        enabled: true
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      limits:
        memory: 4Gi
      requests:
        memory: 2Gi
enableVSHNPostgreSQL: false
generatePostgresSecret: true
env: {}
