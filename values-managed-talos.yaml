litellm:
  db:
    database: litellm_test
  ingress:
    annotations:
      acme.cert-manager.io/http01-edit-in-place: "true"
    className: "cilium"
    hosts:
      - host: test-litellm-proxy.apps.c-managed-talos-lab-rma-0.vshnmanaged.net
        paths:
          - path: /
            pathType: Prefix
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: nonexistent-service
                port:
                  number: 9999
    tls:
      - hosts:
          - test-litellm-proxy.apps.c-managed-talos-lab-rma-0.vshnmanaged.net
        secretName: litellm-ingress
  migrationJob:
    securityContext:
      # Talos does not yet inject a random user id, so we do it
      runAsUser: 42848
      runAsGroup: 0
  podSecurityContext:
    # Talos does not yet inject a random user id, so we do it.
    # Is different from the migration job.
    runAsUser: 42849
    runAsGroup: 0
