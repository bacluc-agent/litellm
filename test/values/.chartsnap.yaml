# Mask litellm subchart version labels so version bumps (appVersion / litellm-helm dependency) don't churn smoke-test.snap; regenerate with ./scripts/chartsnap.sh --update
dynamicFields:
  - kind: ServiceAccount
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
  - kind: Service
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
  - kind: ServiceMonitor
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
  - kind: Deployment
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
      - /spec/template/metadata/labels/helm.sh~1chart
      - /spec/template/metadata/labels/app.kubernetes.io~1version
  - kind: Job
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
      - /spec/template/metadata/labels/helm.sh~1chart
      - /spec/template/metadata/labels/app.kubernetes.io~1version
  - kind: Pod
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /metadata/labels/app.kubernetes.io~1version
