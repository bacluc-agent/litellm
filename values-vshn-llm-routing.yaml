litellm:
  proxyConfigMap:
    create: false
    # workaround until model discovery of litellm works
    name: litellm-config

  proxy_config:
    litellm_settings:
      # it seems litellm strips the whole path of api_base for model discovery and sends the request to <host>/models
      # this is unusable.
      check_provider_endpoint: false
    model_list: []
wrapperProxyConfigMap:
  create: true
  opencodeModels:
    #doesn't work yet, only support Responses api
#    - grok-4.7
    - glm-5.3-flash
    - glm-5.3
    - glm-5.2
    #they don't work yet, only support Responses api
#    - gpt-6-luna
#    - gpt-5.6-luna
    - claude-haiku-5-5
    #doesn't work yet, doesn't support completions api.
#    - gemini-4-argon
    - kimi-k3.1-pro
    - kimi-k3
    - kimi-k2.7-code
    - longcat-2.0
    - step-5-preview
    - beam-free
    - mimo-v2.6-flash
    - mimo-v2.6-pro
    - mimo-v2.5
    - mimo-v2.5-pro
    - minimax-m3.1-flash
    - minimax-m3
    #doesn't work yet, needs consent to train on data.
#    - muse-spark-1.3-contributor
#    - muse-spark-1.2-contributor
    - qwen3.8-max
    - qwen3.8-flash
    - qwen3.7-plus
    - deepseek-v4.1-flash
    - deepseek-v4-pro
    - hy4-preview
    - hy3
  # model_info rows copied from the opencode_go entries in
  # https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
  # so costs, context limits and capabilities are known without routing through the
  # opencode_go provider. Re-sync when models are added or upstream values change.
  opencodeModelInfo:
    glm-5.3-flash:
      pricing_provider: opencode_go
      mode: chat
      max_input_tokens: 1000000
      max_output_tokens: 131072
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 5e-7
      cache_read_input_token_cost: 3e-8
      supports_function_calling: true
      supports_reasoning: true
      supports_vision: true
