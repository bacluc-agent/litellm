litellm:

  proxy_config:
    litellm_settings:
      check_provider_endpoint: true

    model_list:
      - model_name: "opencode/*"
        litellm_params:
          model: "opencode_go/*"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm

      # for api key rotation without downtime
      - model_name: "opencode/*"
        litellm_params:
          model: "opencode_go/*"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_2_API_KEY"
          extra_headers:
            x-opencode-session: litellm

      - model_name: "opencode-fallback/*"
        litellm_params:
          model: "opencode_go/*"
          api_base: "https://opencode.ai/inference/openai/v1"
          api_key: "os.environ/OPENCODE_3_API_KEY"
          extra_headers:
            x-opencode-session: litellm

    router_settings:
      fallbacks:
        - "opencode/*":
            - "opencode-fallback/*"
