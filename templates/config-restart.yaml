{{- $deployment := .Values.configRestart.deploymentName | default (printf "%s-litellm" .Release.Name) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-restart
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-restart
subjects:
  - kind: ServiceAccount
    name: config-restart
---
apiVersion: batch/v1
kind: Job
metadata:
  name: config-restart
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: config-restart
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-restart
          image: {{ .Values.configRestart.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-ec"]
          args:
            - {{ .Files.Get "files/config-restart.sh" | quote }}
          env:
            - name: DEPLOYMENT_NAME
              value: {{ $deployment | quote }}
            - name: WATCH_REFS
              value: {{ join " " .Values.configRestart.watch | quote }}
