{{- define "postgresSecret" -}}
{{- $additionalAnnotations:=.AdditionalAnnotations }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.litellm.db.secret.name }}
  annotations:
    {{- if .AdditionalAnnotations }}
    {{- range $key, $value := $additionalAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
stringData:
  username: {{ .Values.env.APPFLOW_DATABASE_USER | quote }}
  password: {{ .Values.env.APPFLOW_DATABASE_PASSWORD | quote }}
  endpoint: {{ .Values.env.DATABASE_HOST | quote }}
{{- end }}
{{- if .Values.generatePostgresSecret }}
{{- $additionalAnnotations := dict
  "helm.sh/hook" "pre-install,pre-upgrade"
  "helm.sh/hook-weight" "-5"
  "helm.sh/hook-delete-policy" "hook-succeeded"
}}
{{- include "postgresSecret" (dict "Values" .Values "AdditionalAnnotations" $additionalAnnotations) }}
---
{{- include "postgresSecret" (dict "Values" .Values ) }}
{{- end }}
